name : postman collection workflow


on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: 30 00 * * *
    - cron: 00 10 * * 1-5

jobs:
  run-postman-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Install NodeJS and npm
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
     
      -  name: Install Newman and Htlmextra reporter globally
         run: |
           npm install -g newman
           npm install -g newman-reporter-htmlextra
      

      - name: Run the Postman collection with newman
        run: |
          mkdir -p newman
          newman run 'InWarrantyFlow.postman_collection_main.json' \
          --env-var="Domainname=http://64.227.160.186:9000/v1" \
          -r cli,htmlextra
           
      - name: Upload Report
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Newman-Report
          path: newman/*.html

      - name: creating github page branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman/
          
          

           
          
      
