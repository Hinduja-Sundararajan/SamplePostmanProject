name : postman collection workflow


on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: 30 00 * * *
    - cron: 00 10 * * 1-5

jobs:
  run-postman-tests:
    runs-on: ec2-github-runner
    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0

      - name: Install NodeJS and npm
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
     
      -  name: Install Newman and Htlmextra reporter globally
         run: |
           npm install -g newman
           npm install -g newman-reporter-htmlextra
      

      - name: Run the Postman collection with newman
        run: |
          mkdir -p newman
          newman run 'InWarrantyFlow.postman_collection_main.json' \
          --env-var="Domainname=http://64.227.160.186:9000/v1" \
          -r cli,htmlextra \
          --reporter-htmlextra-export ./newman/index.html
           
      - name: Upload Report
        uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: Newman-Report
          path: newman/*.html

      - name: creating github page branch
        if: always()
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: newman/


      - name: send email
        if: always()
        uses: dawidd6/action-send-mail@v23
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_USERNAME }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: Phoenix InWarranty Flow Test Execution Notification
          to: hindujarajan1136@gmail.com
          from: ${{ secrets.EMAIL_USERNAME }}
          body: |
              Hi,
              Phoenix Inwarranty flow tests has been executed. The report has been published and the URL is 
              https://hinduja-sundararajan.github.io/SamplePostmanProject/
              Good day!!
          
          
          

           
          
      
